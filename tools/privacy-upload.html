<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>股票教练智能体 - 本地每日复盘</title>
  <style>
    :root { --ink:#111827; --muted:#667085; --line:#d7dee8; --paper:#f8f4ec; --panel:#fffdf8; --accent:#0f766e; --danger:#b42318; --ok:#067647; --warn:#b54708; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:radial-gradient(circle at 10% 0%,rgba(15,118,110,.16),transparent 28%),linear-gradient(180deg,#fbfaf6,#f4efe5); line-height:1.65; }
    main { max-width:1080px; margin:0 auto; padding:30px 18px 64px; }
    header { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr); gap:24px; align-items:end; margin:18px 0 28px; }
    h1 { max-width:980px; margin:0; font-size:clamp(34px,5vw,64px); line-height:1.05; letter-spacing:0; }
    h2 { margin:0 0 12px; font-size:24px; }
    label { display:block; margin:14px 0 6px; font-weight:700; }
    input[type=text], input[type=date], input[type=url], textarea { width:100%; border:1px solid var(--line); border-radius:14px; padding:11px 12px; font:inherit; background:#fff; color:var(--ink); }
    textarea { min-height:96px; resize:vertical; }
    .trade-text { min-height:220px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; }
    .muted { color:var(--muted); }
    .alert { border:1px solid #fecdca; background:#fff1f0; color:var(--danger); padding:14px 16px; border-radius:16px; }
    .panel { border:1px solid rgba(17,24,39,.10); background:rgba(255,253,248,.82); border-radius:22px; padding:20px; margin:16px 0; box-shadow:0 18px 60px rgba(17,24,39,.06); }
    .hero-card { background:#111827; color:#fff; border-radius:24px; padding:22px; }
    .hero-card p { color:#d0d5dd; margin:8px 0 0; }
    .drop { border:1px dashed #98a2b3; border-radius:16px; padding:16px; background:#fff; }
    button, .button { display:inline-flex; align-items:center; justify-content:center; border:0; background:var(--accent); color:#fff; padding:11px 16px; border-radius:999px; cursor:pointer; text-decoration:none; font-weight:700; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    pre { white-space:pre-wrap; background:#101820; color:#f3f7fa; padding:12px; border-radius:14px; overflow:auto; }
    .ok { color:var(--ok); } .bad { color:var(--danger); }
    .grid { display:grid; grid-template-columns:repeat(12,1fr); grid-auto-flow:dense; gap:14px; }
    .span-6 { grid-column:span 6; } .span-12 { grid-column:span 12; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 10px; color:#344054; }
    dl { display:grid; grid-template-columns:170px minmax(0,1fr); gap:8px 12px; }
    dt { color:var(--muted); } dd { margin:0; word-break:break-all; }
    @media (max-width:820px) { header,.grid { grid-template-columns:1fr; } .span-6,.span-12 { grid-column:span 1; } main { padding:18px 12px 48px; } }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>股票教练智能体</h1>
      <p class="muted">默认粘贴当天交割单文本，本机解析成交记录，再生成每日交易教练报告。</p>
    </div>
    <aside class="hero-card">
      <strong>本地处理边界</strong>
      <p>不上传服务器，不联网发送交割单。市场背景可联网校验，但不会把用户判断直接当事实。</p>
    </aside>
  </header>

  <p class="alert">真实 PDF、截图和原始交割单不要发给 AI。默认把券商成交记录页面复制为文本粘贴到下方；PDF/CSV/XLSX 仅作为可选本地入口。</p>

  <section class="panel">
    <h2>每日输入</h2>
    <form id="uploadForm" enctype="multipart/form-data">
      <label for="pastedTrades">粘贴今日交割单文本</label>
      <p class="muted">可直接从券商成交记录页面复制表格文本粘贴。支持字段示例：序号、成交时间、证券代码、证券名称、委托方向、成交数量、成交价格、成交金额。</p>
      <textarea id="pastedTrades" class="trade-text" name="pasted_trades_text" required placeholder="序号    成交时间    证券代码    证券名称    委托方向    成交数量    成交价格    成交金额&#10;1    09:40:15    301171    易点天下    证券买入    1500    34.900    52350.000"></textarea>

      <div class="grid">
        <div class="span-6">
          <label for="tradeDate">交易日期</label>
          <input id="tradeDate" name="trade_date" type="date">
        </div>
        <div class="span-6">
          <label>情绪标签</label>
          <div class="chips">
            <label class="chip"><input name="mood" type="radio" value="冷静">冷静</label>
            <label class="chip"><input name="mood" type="radio" value="怕卖飞">怕卖飞</label>
            <label class="chip"><input name="mood" type="radio" value="急于扳回">急于扳回</label>
            <label class="chip"><input name="mood" type="radio" value="犹豫">犹豫</label>
            <label class="chip"><input name="mood" type="radio" value="防守">防守</label>
            <label class="chip"><input name="mood" type="radio" value="兴奋">兴奋</label>
            <label class="chip"><input name="mood" type="radio" value="不甘心">不甘心</label>
          </div>
        </div>
      </div>

      <label for="tradingIdea">今日交易想法</label>
      <textarea id="tradingIdea" name="trading_idea" placeholder="可选。写下你今天为什么交易、想验证什么。"></textarea>

      <label for="marketView">我对今日市场的判断</label>
      <textarea id="marketView" name="market_view" placeholder="可选。智能体会独立判断市场环境，并对这里的判断做校正。"></textarea>

      <label for="articleUrl">今日阅读文章 URL</label>
      <input id="articleUrl" name="article_url" type="text" placeholder="可选，多个 URL 可用空格或换行分隔。">

      <label for="articleText">今日阅读文章摘录</label>
      <textarea id="articleText" name="article_text" placeholder="可选。长期只保存观点摘要和叙事污染检查，不保存全文。"></textarea>

      <label for="candidatePool">候选池 / 强势榜文本</label>
      <textarea id="candidatePool" name="candidate_pool_text" placeholder="可选。每行包含：证券代码 证券名称 题材/位置/量能/均线/止损线索。例如：301421 波长光电 科技 放量 回踩200日线 止损200日线。未填写时，报告会明确无法生成研究候选池，不会硬编股票。"></textarea>

      <label for="plan">计划与复盘备注</label>
      <textarea id="plan" name="plan" placeholder="可选。写下原计划、退出条件、盘后复盘。"></textarea>

      <div class="drop">
        <strong>可选上传：PDF / CSV / XLSX</strong>
        <p class="muted">截图识别已降级为备用能力；默认不在此页面上传截图。</p>
        <input id="fileInput" name="trade_files" type="file" accept="application/pdf,.pdf,.csv,.xlsx,.xlsm" multiple>
      </div>

      <label><input id="articleInfluenced" name="article_influenced" type="checkbox"> 今天交易动作受文章观点影响</label>

      <label for="disciplineTags">纪律标签</label>
      <input id="disciplineTags" name="discipline_tags" type="text" placeholder="可选，用逗号分隔，例如：追高,补仓,止损">

      <p><button id="submitButton" type="submit">生成每日教练报告</button></p>
    </form>
  </section>

  <section class="panel">
    <h2>处理结果</h2>
    <div id="status" class="muted">等待提交。</div>
    <div id="result"></div>
  </section>
</main>
<script>
  const form = document.getElementById("uploadForm");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");
  const button = document.getElementById("submitButton");

  function escapeText(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
  }

  function renderResult(data) {
    const cls = data.status === "ok" ? "ok" : "bad";
    const lines = data.messages || [];
    const details = data.paths || {};
    const reportLink = data.report_url ? `<p><a class="button" href="${escapeText(data.report_url)}" target="_blank" rel="noopener">打开每日 HTML 报告</a></p>` : "";
    const xueqiuLink = data.xueqiu_post_url ? `<p><a class="button" href="${escapeText(data.xueqiu_post_url)}" target="_blank" rel="noopener">打开雪球发布版</a></p>` : "";
    const stableLink = data.stable_report_url ? `<p><a class="button" href="${escapeText(data.stable_report_url)}" target="_blank" rel="noopener">打开稳定入口</a></p>` : "";
    resultEl.innerHTML = `
      <p class="${cls}"><strong>${escapeText(data.title || data.status)}</strong></p>
      <pre>${escapeText(lines.join("\\n"))}</pre>
      <dl>
        <dt>隐私检查</dt><dd>${escapeText(data.privacy_status || "未完成")}</dd>
        <dt>粘贴解析 CSV</dt><dd><code>${escapeText(details.pasted_trades || "")}</code></dd>
        <dt>标准交易 CSV</dt><dd><code>${escapeText(details.cleaned_trades || "")}</code></dd>
        <dt>市场环境</dt><dd><code>${escapeText(details.market_context || "")}</code></dd>
        <dt>双镜片判断</dt><dd><code>${escapeText(details.coach_lens || "")}</code></dd>
        <dt>研究候选池</dt><dd><code>${escapeText(details.candidate_pool || "")}</code></dd>
        <dt>文章摘要</dt><dd><code>${escapeText(details.article_digest || "")}</code></dd>
        <dt>Playbook</dt><dd><code>${escapeText(details.playbooks || "")}</code></dd>
        <dt>买前反问</dt><dd><code>${escapeText(details.pre_trade_guard || "")}</code></dd>
        <dt>HTML 报告</dt><dd><code>${escapeText(details.html_report || "")}</code></dd>
        <dt>雪球发布版</dt><dd><code>${escapeText(details.xueqiu_post_html || "")}</code></dd>
      </dl>
      ${reportLink}${xueqiuLink}${stableLink}
    `;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!document.getElementById("pastedTrades").value.trim()) return;
    button.disabled = true;
    statusEl.textContent = "正在本机处理，请不要关闭此页面。";
    resultEl.innerHTML = "";
    const body = new FormData(form);
    try {
      const response = await fetch("/upload", { method: "POST", body });
      const data = await response.json();
      renderResult(data);
      statusEl.textContent = response.ok ? "处理完成。" : "处理失败。";
    } catch (error) {
      statusEl.textContent = "处理失败。";
      renderResult({ status:"error", title:"请求失败", messages:[String(error)] });
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
